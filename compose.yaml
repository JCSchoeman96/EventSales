services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: eventsales:local
    init: true
    restart: unless-stopped
    env_file:
      - "${EVENTSALES_DEPLOY_ENV_FILE:?Set EVENTSALES_DEPLOY_ENV_FILE to a protected deployment env file}"
    environment:
      PHX_SERVER: "true"
      PORT: "4000"
      EVENTSALES_BUSINESS_TIMEZONE: Africa/Johannesburg
      EVENTSALES_DEFAULT_CURRENCY: ZAR
    ports:
      - "127.0.0.1:4000:4000"
