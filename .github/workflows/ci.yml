name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.19.3"
  OTP_VERSION: "28"

jobs:
  format_compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Fetch locked dependencies
        run: mix deps.get --check-locked

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Check for unused dependencies in mix.lock
        run: mix deps.unlock --check-unused

      - name: Check WooCommerce web-layer boundary
        run: bash scripts/check_no_web_woocommerce_refs.sh

  lint_security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Fetch locked dependencies
        run: mix deps.get --check-locked

      - name: Run Credo
        run: mix credo --strict

      - name: Run Sobelow
        run: mix sobelow

      - name: Audit dependencies
        run: mix deps.audit

      - name: Audit Hex packages
        run: mix hex.audit

  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_HOST: 127.0.0.1
      TEST_DATABASE_PORT: "5432"
      TEST_DATABASE_USERNAME: postgres
      TEST_DATABASE_PASSWORD: postgres
      TEST_DATABASE_NAME: event_sales_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_sales_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_sales_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Fetch locked dependencies
        run: mix deps.get --check-locked

      - name: Create test database
        run: mix ecto.create

      - name: Run test migrations
        run: mix ecto.migrate

      - name: Verify Ash codegen is in sync
        run: mix ash.codegen --dry-run

      - name: Verify Ash generated files are unchanged
        run: git diff --exit-code priv/repo/migrations priv/resource_snapshots

      - name: Run tests
        run: mix test

  ash_codegen:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_HOST: 127.0.0.1
      TEST_DATABASE_PORT: "5432"
      TEST_DATABASE_USERNAME: postgres
      TEST_DATABASE_PASSWORD: postgres
      TEST_DATABASE_NAME: event_sales_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_sales_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_sales_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Fetch locked dependencies
        run: mix deps.get --check-locked

      - name: Create test database
        run: mix ecto.create

      - name: Run test migrations
        run: mix ecto.migrate

      - name: Verify Ash codegen is in sync
        run: mix ash.codegen --dry-run

      - name: Verify Ash generated files are unchanged
        run: git diff --exit-code priv/repo/migrations priv/resource_snapshots

  dialyzer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-dialyzer-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Fetch locked dependencies
        run: mix deps.get --check-locked

      - name: Run Dialyzer
        run: mix dialyzer

  playwright_unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/playwright-staging/package-lock.json

      - name: Install Playwright harness dependencies
        working-directory: tools/playwright-staging
        run: npm ci

      - name: Run secret-free staging URL unit tests
        working-directory: tools/playwright-staging
        env:
          STAGING_BASE_URL: https://example.e.wpstage.net/w/
          STAGING_HTTP_USERNAME: placeholder
          STAGING_HTTP_PASSWORD: placeholder
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm run test:unit
